name: Build IME stones

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "Space-separated recipes to rebuild (empty = auto from changed paths)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "**/stone.yaml"
      - "**/*.tar.xz"
      - "**/pkg/**"
      - justfile
      - .github/workflows/build.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ALL_RECIPES: pinyinwl-data libchewing-data pinyinwl chewingwl cosmic-comp cosmic-applets cosmic-session
  PAGES_BASE: https://rano-oss.github.io/moss-recipes/x86_64

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.pick.outputs.recipes }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which recipes to rebuild
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          manual="${{ github.event.inputs.recipes }}"
          if [ -n "${manual}" ]; then
            recipes="${manual}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run with empty input → rebuild nothing unless forced; default to changed
            recipes=""
          else
            recipes=""
          fi

          if [ -z "${recipes}" ]; then
            before="${{ github.event.before }}"
            if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
            if [ -n "${before}" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "${before}" "${{ github.sha }}")"
            else
              changed="$(git show --name-only --pretty='' HEAD)"
            fi
            echo "Changed files:"
            echo "${changed}"

            # Workflow / justfile changes alone do not rebuild packages
            recipes=""
            for r in ${ALL_RECIPES}; do
              if echo "${changed}" | grep -qE "^${r}/"; then
                recipes="${recipes} ${r}"
              fi
            done
            recipes="$(echo ${recipes})"
          fi

          if [ -z "${recipes}" ]; then
            echo "No recipe rebuilds needed (publish will refresh index from Pages)."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "recipes=[]" >> "$GITHUB_OUTPUT"
          else
            echo "Rebuilding:${recipes}"
            json="$(printf '%s\n' ${recipes} | jq -R . | jq -sc .)"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "recipes=${json}" >> "$GITHUB_OUTPUT"
          fi

  tools:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang pkg-config curl git \
            libarchive-tools ca-certificates

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-os-tools-${{ runner.os }}-1.94

      - name: Build and install moss + boulder
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/AerynOS/os-tools.git "$HOME/os-tools"
          cd "$HOME/os-tools"
          just get-started
          rm -rf "$HOME/os-tools" "$HOME/.cargo/registry/src" || true
          df -h /

      - name: Pack tooling
        run: |
          set -euo pipefail
          mkdir -p "$HOME/aos-tools-pack"
          cp -a "$HOME/.local/bin/boulder" "$HOME/.local/bin/moss" "$HOME/aos-tools-pack/"
          cp -a "$HOME/.local/share/boulder" "$HOME/aos-tools-pack/share-boulder"
          cp -a "$HOME/.config/boulder" "$HOME/aos-tools-pack/config-boulder"
          tar -C "$HOME/aos-tools-pack" -cJf aos-tools.tar.xz .
          ls -lh aos-tools.tar.xz

      - name: Upload tooling artifact
        uses: actions/upload-artifact@v4
        with:
          name: aos-tools
          path: aos-tools.tar.xz
          retention-days: 3

  build:
    needs: [select, tools]
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJson(needs.select.outputs.recipes) }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout recipes
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools ca-certificates

      - name: Configure subuid/subgid
        run: |
          sudo touch /etc/subuid /etc/subgid
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 1065536-1131071 --add-subgids 1065536-1131071 "${USER}"
          fi
          if ! grep -q "^root:" /etc/subuid; then
            sudo usermod --add-subuids 1000000-1065535 --add-subgids 1000000-1065535 root
          fi
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi

      - name: Download tooling
        uses: actions/download-artifact@v4
        with:
          name: aos-tools
          path: /tmp/aos-tools

      - name: Install tooling
        run: |
          set -euo pipefail
          mkdir -p /tmp/aos-unpack "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config"
          tar -C /tmp/aos-unpack -xJf /tmp/aos-tools/aos-tools.tar.xz
          install -m755 /tmp/aos-unpack/boulder /tmp/aos-unpack/moss "$HOME/.local/bin/"
          rm -rf "$HOME/.local/share/boulder" "$HOME/.config/boulder"
          cp -a /tmp/aos-unpack/share-boulder "$HOME/.local/share/boulder"
          cp -a /tmp/aos-unpack/config-boulder "$HOME/.config/boulder"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          boulder --version
          moss --version
          df -h /

      - name: Configure boulder profile
        run: |
          set -euo pipefail
          LOCAL_REPO="${RUNNER_TEMP}/local_repo"
          mkdir -p "$LOCAL_REPO" "$HOME/.config/boulder/profile.d"
          moss index -i "$LOCAL_REPO"

          cat > "$HOME/.config/boulder/profile.d/ci-x86_64.kdl" <<EOF
          ci-x86_64 {
            repositories {
              local {
                description "CI scratch local repo"
                uri "file://${LOCAL_REPO}/stone.index"
                priority 100
                active #true
              }
              volatile {
                description "aerynOS volatile stream (CDN)"
                base-uri "https://cdn.aerynos.dev/"
                channel "main"
                version "stream/volatile"
                arch "x86_64"
                priority 0
                active #true
              }
            }
          }
          EOF
          sed -i 's/^          //' "$HOME/.config/boulder/profile.d/ci-x86_64.kdl"
          echo "LOCAL_REPO=${LOCAL_REPO}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          BOULDER_BIN="${HOME}/.local/bin/boulder"
          BOULDER_FLAGS=(--data-dir="${HOME}/.local/share/boulder" --config-dir="${HOME}/.config/boulder" --moss-root="${HOME}/.cache/boulder")

          name="${{ matrix.recipe }}"
          dir="${GITHUB_WORKSPACE}/${name}"
          cd "$dir"
          recipe=stone.yaml
          cleanup=
          if grep -q '__RECIPE_DIR__' stone.yaml; then
            recipe="$(mktemp ./stone.XXXXXX.yaml)"
            sed "s|__RECIPE_DIR__|${dir}|g" stone.yaml > "$recipe"
            cleanup=$recipe
          fi

          df -h /
          "${BOULDER_BIN}" "${BOULDER_FLAGS[@]}" build -y -u -p ci-x86_64 "$recipe"
          if [ -n "${cleanup}" ]; then rm -f "${cleanup}"; fi

          shopt -s nullglob
          stones=(./*.stone)
          if (( ${#stones[@]} == 0 )); then
            echo "no .stone produced for ${name}" >&2
            exit 1
          fi

          mkdir -p "${GITHUB_WORKSPACE}/out"
          mv -v "${stones[@]}" "${GITHUB_WORKSPACE}/out/"
          rm -rf "${HOME}/.cache/boulder" || true
          df -h /

      - name: Upload stones for ${{ matrix.recipe }}
        uses: actions/upload-artifact@v4
        with:
          name: stone-${{ matrix.recipe }}
          path: out/*.stone
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [select, build]
    if: always() && (needs.select.outputs.build == 'false' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install moss (for index + pkg list)
        run: |
          set -euo pipefail
          # Lightweight: reuse aos-tools artifact when we built; otherwise fetch moss only via os-tools is heavy.
          # Prefer downloading published index via curl + a prebuilt moss from a prior tools artifact if present.
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates jq

      - name: Download tooling if present
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aos-tools
          path: /tmp/aos-tools

      - name: Ensure moss binary
        run: |
          set -euo pipefail
          if [ -f /tmp/aos-tools/aos-tools.tar.xz ]; then
            mkdir -p /tmp/aos-unpack "$HOME/.local/bin"
            tar -C /tmp/aos-unpack -xJf /tmp/aos-tools/aos-tools.tar.xz
            install -m755 /tmp/aos-unpack/moss "$HOME/.local/bin/"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            # No rebuild this run — install moss from os-tools quickly for indexing only
            sudo apt-get install -y build-essential clang pkg-config git libarchive-tools
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94
            . "$HOME/.cargo/env"
            cargo install just --locked
            git clone --depth 1 https://github.com/AerynOS/os-tools.git "$HOME/os-tools"
            cd "$HOME/os-tools"
            just get-started
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            rm -rf "$HOME/os-tools"
          fi
          moss --version

      - name: Seed repo from live Pages
        run: |
          set -euo pipefail
          mkdir -p repo/x86_64 /tmp/pages-root
          moss -D /tmp/pages-root repo add pages "${PAGES_BASE}/stone.index" -p 100 -y
          # List available packages and download their .stone files by conventional name
          mapfile -t lines < <(moss -D /tmp/pages-root pkg list -a | sed -E 's/  +/ /g' | awk 'NF>=2 {print $1,$2}')
          for line in "${lines[@]}"; do
            name="${line%% *}"
            verrel="${line##* }"
            # verrel like 0.1.0-1005
            for suffix in "" "-dbginfo"; do
              pkgname="${name}"
              # dbginfo packages are listed separately as name-dbginfo
              true
            done
            file="${name}-${verrel}-1-x86_64.stone"
            url="${PAGES_BASE}/${file}"
            code="$(curl -sI -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" = "200" ]; then
              echo "fetch ${file}"
              curl -fsSL "$url" -o "repo/x86_64/${file}"
            else
              echo "skip ${file} (HTTP ${code})"
            fi
          done
          ls -lah repo/x86_64 || true

      - name: Download newly built stones
        if: needs.select.outputs.build == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: stone-*
          path: stones-new
          merge-multiple: true

      - name: Overlay new stones and reindex
        run: |
          set -euo pipefail
          mkdir -p repo/x86_64
          if [ -d stones-new ]; then
            # Drop older builds of the same package name before adding new ones
            while IFS= read -r -d '' stone; do
              base="$(basename "$stone")"
              # package name is everything before the version (last components: VER-REL-1-arch.stone)
              pkg="$(echo "$base" | sed -E 's/-[0-9].*$//')"
              echo "replacing ${pkg} with ${base}"
              find repo/x86_64 -maxdepth 1 -type f -name "${pkg}-*.stone" -delete
              mv -v "$stone" repo/x86_64/
            done < <(find stones-new -type f -name '*.stone' -print0)
          fi
          moss index -i repo/x86_64
          ls -lah repo/x86_64

      - name: Upload stones artifact
        uses: actions/upload-artifact@v4
        with:
          name: ime-stones
          path: repo/x86_64/*
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
