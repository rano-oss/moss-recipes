name        : chewingwl
version     : "0.1.0"
release     : 1009
homepage    : https://github.com/rano-oss/chewingwl
upstreams   :
    - git|https://github.com/rano-oss/chewingwl.git :
        ref: b48cdf2e9bd33c7e97e2a0e292c279caaf74dc1e
summary     : Chewing / Zhuyin input method for Wayland / COSMIC
description : |
    Chewing IME for Wayland with xx-input-method support
    (branch experimental/xx-im-preedit-start).
    Registers layout "tw" in CosmicComp input_method_map via a
    fragment + moss sys trigger (removed again on uninstall).
license     : MIT
builddeps   :
    - pkgconfig(xkbcommon)
rundeps     :
    - libchewing-data
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
    install -Dm755 %(pkgdir)/cosmic-ime-merge-map %(installroot)/usr/bin/cosmic-ime-merge-map
    install -Dm644 %(pkgdir)/tw.ron %(installroot)%(datadir)/cosmic/com.system76.CosmicComp/v1/input_method_map.d/tw.ron
    install -Dm644 %(pkgdir)/cosmic-input-method-map.yaml %(installroot)%(datadir)/moss/triggers/sys.d/cosmic-input-method-map.yaml
